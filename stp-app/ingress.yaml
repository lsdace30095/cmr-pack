apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stp-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - stp-app.yourdomain.com
    secretName: stp-tls-secret
  rules:
  - host: stp-app.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: stp-service
            port:
              number: 80